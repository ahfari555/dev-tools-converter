<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev & Design Web Converter Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

  <header class="max-w-4xl mx-auto text-center my-8">
    <h1 class="text-4xl font-extrabold text-indigo-400 mb-2">Dev & Designer Converter Tools</h1>
    <p class="text-slate-400">Kumpulan alat konversi serbaguna untuk pengembang dan desainer web.</p>
  </header>

  <main class="max-w-4xl mx-auto space-y-8">

    <!-- TOOL 1: PX to REM / EM Converter -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
      <h2 class="text-2xl font-bold mb-4 text-indigo-300">1. PX ke REM / EM Converter</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
          <label class="block text-sm font-medium mb-1">Base Font Size (PX):</label>
          <input type="number" id="basePx" value="16" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" oninput="convertPx()">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Input Pixels (PX):</label>
          <input type="number" id="inputPx" value="16" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" oninput="convertPx()">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Hasil Konversi:</label>
          <div class="flex gap-2">
            <input type="text" id="resultRem" readonly class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-indigo-400 font-mono font-bold">
            <button onclick="copyToClipboard('resultRem')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded text-sm font-medium">Copy</button>
          </div>
        </div>
      </div>
    </section>

    <!-- TOOL 2: HEX to RGB / HSL Color Converter -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
      <h2 class="text-2xl font-bold mb-4 text-indigo-300">2. Color Converter (HEX ke RGB & HSL)</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium mb-1">Pilih / Masukkan HEX Color:</label>
          <div class="flex gap-2">
            <input type="color" id="colorPicker" value="#6366f1" class="h-10 w-12 rounded cursor-pointer border-0 bg-transparent" onchange="convertColorFromPicker()">
            <input type="text" id="hexInput" value="#6366f1" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono" oninput="convertColor()">
          </div>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">RGB Format:</label>
            <div class="flex gap-2">
              <input type="text" id="rgbResult" readonly class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-indigo-400 font-mono">
              <button onclick="copyToClipboard('rgbResult')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded text-sm font-medium">Copy</button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">HSL Format:</label>
            <div class="flex gap-2">
              <input type="text" id="hslResult" readonly class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-indigo-400 font-mono">
              <button onclick="copyToClipboard('hslResult')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded text-sm font-medium">Copy</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- TOOL 3: Text Case Converter -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
      <h2 class="text-2xl font-bold mb-4 text-indigo-300">3. Text Case & URL Slug Converter</h2>
      <textarea id="caseInput" rows="3" placeholder="Ketik atau paste teks di sini..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white mb-4"></textarea>
      <div class="flex flex-wrap gap-2 mb-4">
        <button onclick="transformText('upper')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-sm">UPPERCASE</button>
        <button onclick="transformText('lower')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-sm">lowercase</button>
        <button onclick="transformText('title')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-sm">Title Case</button>
        <button onclick="transformText('slug')" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded text-sm">url-slug-case</button>
      </div>
      <div class="flex gap-2">
        <input type="text" id="caseResult" readonly class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-indigo-400 font-mono" placeholder="Hasil konversi teks akan muncul di sini...">
        <button onclick="copyToClipboard('caseResult')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded text-sm font-medium">Copy</button>
      </div>
    </section>

  </main>

  <script>
    function convertPx() {
      const base = parseFloat(document.getElementById('basePx').value) || 16;
      const px = parseFloat(document.getElementById('inputPx').value) || 0;
      const rem = (px / base).toFixed(4).replace(/\.?0+$/, "");
      document.getElementById('resultRem').value = `${rem}rem`;
    }

    function convertColorFromPicker() {
      const color = document.getElementById('colorPicker').value;
      document.getElementById('hexInput').value = color;
      convertColor();
    }

    function convertColor() {
      let hex = document.getElementById('hexInput').value.trim();
      if (!hex.startsWith('#')) hex = '#' + hex;
      if (/^#[0-9A-F]{6}$/i.test(hex)) {
        document.getElementById('colorPicker').value = hex;
        
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        document.getElementById('rgbResult').value = `rgb(${r}, ${g}, ${b})`;

        const rNorm = r / 255, gNorm = g / 255, bNorm = b / 255;
        const max = Math.max(rNorm, gNorm, bNorm), min = Math.min(rNorm, gNorm, bNorm);
        let h, s, l = (max + min) / 2;

        if (max === min) {
          h = s = 0;
        } else {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case rNorm: h = (gNorm - bNorm) / d + (gNorm < bNorm ? 6 : 0); break;
            case gNorm: h = (bNorm - rNorm) / d + 2; break;
            case bNorm: h = (rNorm - gNorm) / d + 4; break;
          }
          h /= 6;
        }
        document.getElementById('hslResult').value = `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
      }
    }

    function transformText(type) {
      const text = document.getElementById('caseInput').value;
      let result = '';
      if (type === 'upper') result = text.toUpperCase();
      if (type === 'lower') result = text.toLowerCase();
      if (type === 'title') {
        result = text.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
      }
      if (type === 'slug') {
        result = text.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-').replace(/^-+|-+$/g, '');
      }
      document.getElementById('caseResult').value = result;
    }

    function copyToClipboard(id) {
      const input = document.getElementById(id);
      if (input.value) {
        navigator.clipboard.writeText(input.value);
        alert('Teks berhasil disalin!');
      }
    }

    convertPx();
    convertColor();
  </script>
</body>
</html>
