<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - OmniConvert</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-['Plus_Jakarta_Sans'] p-6 md:p-12 min-h-screen flex items-center justify-center">
  <div class="max-w-xl w-full bg-white p-8 md:p-10 rounded-3xl shadow-sm border border-slate-200/80 space-y-6">
    <a href="index.html" class="inline-flex items-center text-sm font-bold text-indigo-600 hover:text-indigo-800 mb-2">← Back to OmniConvert</a>
    <h1 class="text-3xl font-extrabold text-slate-900">Contact Us</h1>
    <p class="text-sm text-slate-500">Have questions, tool suggestions, or bug reports? Reach out to us below.</p>

    <form onsubmit="event.preventDefault(); alert('Thank you for reaching out! We will reply shortly.');" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Your Name</label>
        <input type="text" required placeholder="John Doe" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
        <input type="email" required placeholder="john@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Message</label>
        <textarea rows="4" required placeholder="How can we help you?" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm"></textarea>
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md">Send Message</button>
    </form>
  </div>
</body>
</html>
